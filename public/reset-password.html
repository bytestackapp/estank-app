<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Tank Estimator</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #1a202c;
    }
    p {
      font-size: 14px;
      color: #718096;
      margin-bottom: 24px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }
    .form-input:focus { border-color: #4299e1; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2b6cb0; }
    .msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }
    .success { color: #38a169; }
    .error { color: #e53e3e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Reset Password</h2>
    <p>Enter your new password below.</p>
    <input type="password" id="newPassword" class="form-input" placeholder="New password" minlength="6">
    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password">
    <button class="btn" onclick="resetPassword()">Reset Password</button>
    <p id="msg" class="msg"></p>
  </div>

  <script>
    // Get access token from URL hash (Supabase puts it there)
    function getHashParam(key) {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get(key);
    }

    const accessToken = getHashParam('access_token');
    const type = getHashParam('type');

    if (!accessToken || type !== 'recovery') {
      document.getElementById('msg').className = 'msg error';
      document.getElementById('msg').textContent = 'Invalid or expired reset link. Please request a new one.';
      document.querySelector('.btn').disabled = true;
    }

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('msg');

      if (!newPassword || newPassword.length < 6) {
        msg.className = 'msg error';
        msg.textContent = 'Password must be at least 6 characters.';
        return;
      }

      if (newPassword !== confirmPassword) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      msg.className = 'msg';
      msg.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, new_password: newPassword })
        });

        const data = await res.json();

        if (data.success) {
          msg.className = 'msg success';
          msg.textContent = 'Password reset successfully! Redirecting to login...';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message || 'Failed to reset password.';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    }
  </script>
</body>
</html>
