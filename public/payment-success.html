<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment — Tank MTO Estimator Suite</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;
    }
    .card {
      background:#fff; border-radius:20px; padding:2.5rem 2rem;
      max-width:460px; width:100%; text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.2);
      animation:slideUp 0.5s ease;
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
    .icon { font-size:4rem; margin-bottom:1rem; }
    h1 { font-size:1.6rem; font-weight:700; color:#2d3748; margin-bottom:0.5rem; }
    .sub { font-size:0.9rem; color:#718096; margin-bottom:1.5rem; line-height:1.6; }
    .info-box { background:#f7fafc; border-radius:12px; padding:1rem 1.25rem; margin-bottom:1.5rem; text-align:left; }
    .info-row { display:flex; justify-content:space-between; padding:6px 0; font-size:0.875rem; }
    .info-label { color:#718096; }
    .info-value { color:#2d3748; font-weight:600; }
    .btn {
      display:inline-block; padding:12px 28px; border-radius:10px;
      font-size:0.95rem; font-weight:600; text-decoration:none;
      cursor:pointer; border:none; font-family:inherit; transition:all 0.2s;
    }
    .btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; box-shadow:0 4px 14px rgba(102,126,234,0.4); }
    .btn-primary:hover { transform:translateY(-2px); }
    .btn-outline { background:#fff; color:#667eea; border:2px solid #667eea; margin-top:10px; display:block; }
    .btn-outline:hover { background:#f0f4ff; }
    .spinner-wrap { display:flex; align-items:center; justify-content:center; gap:10px; color:#718096; font-size:0.9rem; margin-bottom:1.5rem; }
    .spinner { width:20px; height:20px; border:3px solid #e2e8f0; border-top-color:#667eea; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    Processing your payment...
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const method = params.get('method');
const status = params.get('status');
const email  = params.get('email');

// Get stored user data
const formData       = JSON.parse(sessionStorage.getItem('signup_formData') || '{}');
const selectedPackage = sessionStorage.getItem('signup_package') || '';
const paypalOrderId  = sessionStorage.getItem('paypal_order_id') || '';

async function init() {
  const card = document.getElementById('mainCard');

  // PayPal flow — verify and auto-approve
  if (method === 'paypal' || paypalOrderId) {
    try {
      const res = await fetch('/api/verify-paypal-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          orderId:  paypalOrderId || params.get('token'),
          userData: {
            firstName: formData.firstName,
            lastName:  formData.lastName,
            email:     formData.email,
            username:  formData.username,
            password:  formData.password,
            package:   selectedPackage
          }
        })
      });
      const data = await res.json();

      sessionStorage.clear();

      if (data.verified) {
        card.innerHTML = `
          <div class="icon">🎉</div>
          <h1>Payment Successful!</h1>
          <p class="sub">Your account has been created and activated. Check your email for login details.</p>
          <div class="info-box">
            <div class="info-row"><span class="info-label">Transaction ID</span><span class="info-value">${data.transactionId}</span></div>
            <div class="info-row"><span class="info-label">Amount</span><span class="info-value">$${data.amount}</span></div>
            <div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color:#38a169;">✅ Confirmed</span></div>
          </div>
          <a href="/login" class="btn btn-primary">Log In Now</a>
        `;
      } else {
        card.innerHTML = `
          <div class="icon">❌</div>
          <h1>Payment Not Verified</h1>
          <p class="sub">We could not verify your payment. Please contact support with your PayPal transaction details.</p>
          <a href="/signup" class="btn btn-outline">Try Again</a>
        `;
      }
    } catch(e) {
      card.innerHTML = `
        <div class="icon">⚠️</div>
        <h1>Verification Error</h1>
        <p class="sub">Something went wrong. Please contact support.</p>
        <a href="/signup" class="btn btn-outline">Go Back</a>
      `;
    }
    return;
  }

  // PH payment flow — pending approval
  if (status === 'pending') {
    sessionStorage.clear();
    card.innerHTML = `
      <div class="icon">📬</div>
      <h1>Payment Submitted!</h1>
      <p class="sub">
        Thank you! We received your payment submission.<br>
        We'll verify it and activate your account within <strong>1-24 hours</strong>.<br>
        A confirmation has been sent to <strong>${email || 'your email'}</strong>.
      </p>
      <div class="info-box">
        <div class="info-row"><span class="info-label">Payment Method</span><span class="info-value">${method?.toUpperCase() || 'N/A'}</span></div>
        <div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color:#c97000;">⏳ Pending Verification</span></div>
      </div>
      <a href="/login" class="btn btn-primary">Go to Login</a>
      <a href="/signup" class="btn btn-outline">Back to Signup</a>
    `;
    return;
  }

  // Fallback
  card.innerHTML = `
    <div class="icon">✅</div>
    <h1>Thank You!</h1>
    <p class="sub">Your request has been received. We'll be in touch soon.</p>
    <a href="/login" class="btn btn-primary">Go to Login</a>
  `;
}

init();
</script>
</body>
</html>
